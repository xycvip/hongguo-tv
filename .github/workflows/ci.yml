name: Build Media3 APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-standard-apk:
    name: Build standard APK only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read APK version
        run: python3 scripts/release_metadata.py --github-env "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: go.mod

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build Android native core
        run: bash scripts/build_android_binaries.sh
        env:
          VERSION: ${{ env.HONGGUO_CORE_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble standard debug APK
        run: gradle --no-daemon --max-workers=1 -p android :app:assembleStandardDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: media3-primary-standard-debug
          path: android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 7
